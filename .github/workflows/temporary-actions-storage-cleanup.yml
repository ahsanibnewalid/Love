name: Temporary Actions storage cleanup
on:
  push:
    paths:
      - '.github/workflows/temporary-actions-storage-cleanup.yml'
  workflow_dispatch:
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Delete Actions artifacts, completed runs and caches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os,json,time,urllib.request,urllib.error
          base="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          own=int(os.environ["GITHUB_RUN_ID"])
          counts={"artifacts":0,"artifact_bytes":0,"runs":0,"caches":0,"cache_bytes":0}
          def api(path,method="GET"):
              req=urllib.request.Request(base+path,headers=headers,method=method)
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req,timeout=60) as response:
                          raw=response.read()
                          return json.loads(raw) if raw else None
                  except urllib.error.HTTPError as e:
                      if e.code==404 and method=="DELETE": return None
                      if e.code in (429,500,502,503,504) and attempt<4:
                          time.sleep(3*(attempt+1));continue
                      raise
          def purge(path,key,delete_prefix,count_key,byte_key=None):
              while True:
                  items=api(path+"?per_page=100")[key]
                  if not items: break
                  for item in items:
                      api(delete_prefix+str(item["id"]),"DELETE")
                      counts[count_key]+=1
                      if byte_key: counts[byte_key]+=item.get("size_in_bytes",0)
                  print(json.dumps(counts),flush=True)
          purge("/actions/artifacts","artifacts","/actions/artifacts/","artifacts","artifact_bytes")
          while True:
              runs=api("/actions/runs?status=completed&per_page=100")["workflow_runs"]
              runs=[r for r in runs if r["id"]!=own]
              if not runs: break
              for r in runs:
                  api("/actions/runs/"+str(r["id"]),"DELETE")
                  counts["runs"]+=1
              print(json.dumps(counts),flush=True)
          purge("/actions/caches","actions_caches","/actions/caches/","caches","cache_bytes")
          remaining={k:api(p+"?per_page=1")["total_count"] for k,p in {"artifacts":"/actions/artifacts","caches":"/actions/caches","runs":"/actions/runs"}.items()}
          report="## Actions storage cleanup\n\nDeleted: "+json.dumps(counts)+"\n\nRemaining (includes this cleanup run): "+json.dumps(remaining)+"\n"
          print(report,flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write(report)
