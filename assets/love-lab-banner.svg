<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Love Lab — a little feeling, a little code</title><desc id="desc">A dark plum banner with a glowing pink heart and the words Love Lab.</desc>
<defs><radialGradient id="bg" cx="78%" cy="10%" r="100%"><stop offset="0" stop-color="#652746"/><stop offset="1" stop-color="#170d19"/></radialGradient><linearGradient id="heart" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9fbd"/><stop offset="1" stop-color="#ff477e"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/><circle cx="900" cy="210" r="150" fill="none" stroke="#ff8db5" stroke-opacity=".25"/><circle cx="900" cy="210" r="112" fill="none" stroke="#ff8db5" stroke-opacity=".22"/><path d="M900 290 C860 252 785 205 808 157 C828 117 876 129 900 163 C924 129 972 117 992 157 C1015 205 940 252 900 290Z" fill="url(#heart)" filter="url(#glow)"/><text x="82" y="105" fill="#ff8db5" font-family="monospace" font-size="18" letter-spacing="6">A TINY EXPERIMENT IN BEING HUMAN</text><text x="78" y="214" fill="#fff5f7" font-family="Georgia,serif" font-size="86" font-weight="bold">LOVE LAB</text><text x="84" y="267" fill="#e3c8d7" font-family="Arial,sans-serif" font-size="25">Love isn't an algorithm. But here's one.</text><rect x="84" y="315" width="230" height="42" rx="21" fill="#ff6f9f"/><text x="199" y="342" fill="#2b1020" font-family="monospace" font-size="15" text-anchor="middle">BUILT WITH ♥ + CODE</text><g fill="#ffe5c9" font-size="24"><text x="1055" y="115">✦</text><text x="790" y="300">✧</text><text x="1020" y="320">♡</text></g></svg>